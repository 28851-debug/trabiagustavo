<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos · Trabiagustavo</title><link rel="stylesheet" href="/css/style.css"></head><body data-page="products"><button class="menu-toggle" aria-label="Abrir menu">☰</button><aside><a class="brand" href="/">Trabiagustavo</a><nav><a data-nav="dashboard" href="/">Dashboard</a><a data-nav="products" href="/products.html">Produtos</a><a data-nav="customers" href="/customers.html">Clientes</a><a data-nav="repairs" href="/repairs.html">Reparos</a></nav></aside><main><header class="page-head"><div><p class="eyebrow">Catálogo e estoque</p><h1>Produtos</h1><p>Localize itens por nome, SKU, marca ou compatibilidade.</p></div><button class="primary" id="new-product">Novo produto</button></header><section class="panel filters"><input id="search" type="search" placeholder="Nome, SKU, marca ou compatibilidade"><select id="category-filter" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select><select id="stock-filter" aria-label="Filtrar por estoque"><option value="">Todo estoque</option><option value="in">Em estoque</option><option value="low">Estoque baixo</option><option value="out">Esgotado</option></select><button id="new-category">Nova categoria</button><button id="new-supplier">Novo fornecedor</button></section><section class="panel table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Categoria</th><th>Compatibilidade</th><th>Venda</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead><tbody id="products-body"><tr><td colspan="8">Carregando…</td></tr></tbody></table><p id="empty" hidden>Nenhum produto encontrado.</p></section></main>
<dialog id="product-dialog"><form id="product-form"><div class="dialog-head"><h2>Produto</h2><button type="button" class="icon close" aria-label="Fechar">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>SKU<input name="sku" required></label><label>Nome<input name="name" required></label><label>Categoria<select name="category_id" required></select></label><label>Fornecedor<select name="supplier_id"><option value="">Sem fornecedor</option></select></label><label>Marca<input name="brand"></label><label>Compatibilidade<input name="compatibility"></label><label>Preço de custo<input name="cost_price" inputmode="decimal" required></label><label>Preço de venda<input name="sale_price" inputmode="decimal" required></label><label>Estoque inicial<input name="quantity" type="number" min="0" required></label><label>Estoque mínimo<input name="minimum_stock" type="number" min="0" required></label><label class="full">Observações<textarea name="notes"></textarea></label></div><div class="dialog-actions"><button type="button" class="close">Cancelar</button><button class="primary" type="submit">Salvar produto</button></div></form></dialog>
<dialog id="stock-dialog"><form id="stock-form"><div class="dialog-head"><h2 id="stock-title">Movimentar estoque</h2><button type="button" class="icon close" aria-label="Fechar">×</button></div><p id="current-stock"></p><label id="quantity-field">Quantidade<input name="quantity" type="number" min="1" required></label><label id="new-stock-field" hidden>Novo estoque<input name="new_stock" type="number" min="0"></label><label>Observação ou motivo<input name="note"></label><p id="stock-preview" class="preview"></p><div class="dialog-actions"><button type="button" class="close">Cancelar</button><button class="primary" id="stock-submit" type="submit">Confirmar</button></div></form></dialog>
<dialog id="history-dialog"><div class="dialog-head"><h2>Histórico de estoque</h2><button type="button" class="icon close" aria-label="Fechar">×</button></div><ul id="history-list" class="activity"></ul></dialog><script type="module" src="/js/app.js"></script><script type="module" src="/js/products.js"></script></body></html>
